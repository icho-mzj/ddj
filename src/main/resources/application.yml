server:
  port: 10086
  servlet:
    context-path: /ddj

logging:
  level:
    com.ddj: debug

mybatis:
  type-aliases-package: com.ddj.entity # 别名扫描
  configuration:
    map-underscore-to-camel-case: true # 驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL

#mybatis-plus:
#  # Mapper.xml 文件位置 Maven 多模块项目的扫描路径需以 classpath*: 开头
#  # 实现接口绑定
#  mapperLocations: classpath*:com/ddj/**/mapper/*Mapper.xml

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/ddj?serverTimezone=GMT
    username: root
    password: 4321
  redis:
    # 地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 数据库索引
    database: 0
    # 密码
    password:
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

swagger:
  production: false
  basic:
    enable: true
    username: icho
    password: 4321